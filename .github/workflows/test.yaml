name: test

env:
  GOTOOLCHAIN: local

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true
      - name: Build
        run: make geth

  image:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: l2geth:test
          provenance: false
          sbom: false
          cache-from: type=gha,scope=smock-check-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=smock-check-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Smock check
        run: docker run --rm --entrypoint /usr/local/bin/geth l2geth:test version
